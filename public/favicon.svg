<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1E"/>
      <stop offset="50%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <!-- Border Ring -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="40%" stop-color="#00F0FF"/>
      <stop offset="80%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Tier 3: Gold Top Layer (Curated Marts) -->
    <linearGradient id="gold-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="gold-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Tier 2: Cyan Middle Layer (Silver Conformed Engine) -->
    <linearGradient id="cyan-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cyan-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Tier 1: Emerald/Cobalt Bottom Layer (Bronze Lake Foundation) -->
    <linearGradient id="bronze-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="bronze-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Central Energy Beam -->
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FDE047" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bg-grad)"/>
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="url(#border-grad)" stroke-width="6" stroke-opacity="0.85"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="#00F0FF" opacity="0.08" filter="url(#glow)"/>

  <!-- Connecting Central Beam -->
  <line x1="256" y1="100" x2="256" y2="410" stroke="url(#beam-grad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- ── 1. BOTTOM TIER: BRONZE / EMERALD FOUNDATION ────────────────── -->
  <g filter="url(#shadow)">
    <!-- Left thickness face -->
    <polygon points="96,360 256,430 256,462 96,392" fill="url(#bronze-side)"/>
    <!-- Right thickness face -->
    <polygon points="256,430 416,360 416,392 256,462" fill="#064E3B"/>
    <!-- Top isometric face -->
    <polygon points="256,290 416,360 256,430 96,360" fill="url(#bronze-top)"/>
    <!-- Central node -->
    <circle cx="256" cy="360" r="14" fill="#FFFFFF" filter="url(#glow)"/>
  </g>

  <!-- ── 2. MIDDLE TIER: SILVER / ELECTRIC CYAN ENGINE ───────────────── -->
  <g filter="url(#shadow)">
    <!-- Left thickness face -->
    <polygon points="96,240 256,310 256,342 96,272" fill="url(#cyan-side)"/>
    <!-- Right thickness face -->
    <polygon points="256,310 416,240 416,272 256,342" fill="#075985"/>
    <!-- Top isometric face -->
    <polygon points="256,170 416,240 256,310 96,240" fill="url(#cyan-top)"/>
    <!-- Central node -->
    <circle cx="256" cy="240" r="14" fill="#FFFFFF" filter="url(#glow)"/>
  </g>

  <!-- ── 3. TOP TIER: GOLD CURATED MARTS ────────────────────────────── -->
  <g filter="url(#shadow)">
    <!-- Left thickness face -->
    <polygon points="96,120 256,190 256,222 96,152" fill="url(#gold-side)"/>
    <!-- Right thickness face -->
    <polygon points="256,190 416,120 416,152 256,222" fill="#78350F"/>
    <!-- Top isometric face -->
    <polygon points="256,50 416,120 256,190 96,120" fill="url(#gold-top)"/>
    <!-- Central diamond star on gold tier -->
    <polygon points="256,92 266,114 288,120 266,126 256,148 246,126 224,120 246,114" fill="#FFFFFF" filter="url(#glow)"/>
  </g>

  <!-- Specular Edge Reflections -->
  <line x1="256" y1="50" x2="96" y2="120" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="256" y1="170" x2="96" y2="240" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="256" y1="290" x2="96" y2="360" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
</svg>